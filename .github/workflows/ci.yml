name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Python compile check
        run: |
          python -m py_compile demo_server.py
          python -m py_compile tianyan/deepseek_adapter.py
          python -m py_compile tianyan/mimo_adapter.py
          python -m py_compile mock_backend/server.py

      - name: Mini Program syntax check
        run: |
          node --check miniprogram/utils/api.js
          node --check miniprogram/utils/config.js
          node --check miniprogram/utils/media.js
          node --check miniprogram/pages/index/index.js
          node --check miniprogram/pages/case/case.js

      - name: Run tests
        run: pytest -q

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Pages artifact
        run: python scripts/build_github_pages.py --output .site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
